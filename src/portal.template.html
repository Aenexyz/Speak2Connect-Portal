<!DOCTYPE html>
<html lang="en">
<head>

<title>Speak2Connect Portal</title>

<style>
/* VOICE: a calm, exact operations desk for an agency, nothing decorative.
   IDEA: the headset switchboard: one black console band, clean white call sheets beneath.
   PICTURE: the working portal itself; the logo leads the sign-in screen.
   COLOUR and TYPE: the logo's navy and glowing teal, one teal accent; Montserrat (the wordmark's lettering) + Inter.
   LAYOUT: black console header with tabs, cards and tables in a 1240px column, stacking under 600px. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0a0f1e);--ink:light-dark(#0b1533,#eef3ff);--mute:light-dark(#56607a,#9fabc7);
--line:light-dark(#e1e6ef,#243050);--panel:light-dark(#f3f6fb,#121a30);--acc:#16c7b5;--accInk:light-dark(#0a7a70,#5fe8d8);
--accBg:light-dark(#e4faf7,#0d2c30);--ok:light-dark(#17703f,#6fd79c);--okBg:light-dark(#e7f6ed,#13301f);
--warn:light-dark(#8a5a00,#f2c26b);--warnBg:light-dark(#fff6df,#352a12);--logoF:none;--btnInk:light-dark(#fff,#0b1533)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Montserrat,Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,4vw,44px);font-weight:800}h2{font-size:24px;font-weight:700}h3{font-size:17px;font-weight:700}
p{margin:.3em 0}.mute{color:var(--mute)}.small{font-size:13px}
a{color:var(--accInk)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:96px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
input[type=checkbox]{width:20px;min-height:20px;height:20px;accent-color:var(--acc);margin:0}
label.f,div.f{display:grid;gap:6px;font-weight:600;font-size:14px}label.f small,div.f small{font-weight:400;color:var(--mute)}
.req::after{content:" *";color:var(--accInk)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--btnInk);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--ink)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#061229}.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.link{border:0;background:none;color:var(--accInk);padding:0 6px;min-height:36px}.btn.danger{color:#c42b1c}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.top{background:linear-gradient(90deg,#050a1c,#0c1a45);color:#f2f6ff;padding:12px max(5vw,16px);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 18px rgba(22,199,181,.35)}
.brand b{font:800 18px Montserrat,sans-serif;display:block;line-height:1}.brand span{font:600 11px Montserrat,sans-serif;letter-spacing:.3em;color:#5fe8d8}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.who .btn{border-color:#2a3866;background:transparent;color:#f2f6ff}.who .btn:hover{border-color:#5fe8d8}
.who .btn.acc{background:var(--acc);border-color:var(--acc);color:#061229}
.pill{font-size:13px;padding:6px 12px;border-radius:99px;background:#16224d;color:#cfe0ff;white-space:nowrap}

.tabs{display:flex;gap:4px;padding:0 max(5vw,16px);border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bg)}

main>div{display:grid;gap:20px}main>div:empty{display:none}main{max-width:1240px;margin:0 auto;padding:28px max(4vw,16px) 64px;display:grid;gap:20px}

.badge.ok{background:var(--okBg);color:var(--ok)}.badge.warn{background:var(--warnBg);color:var(--warn)}.badge.acc{background:var(--accBg);color:var(--accInk)}
.big{font:800 clamp(28px,4vw,40px) Montserrat;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border-radius:12px;padding:14px 16px}.stat span{display:block;font-size:13px;color:var(--mute)}.stat b{font:800 24px Montserrat}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;text-align:center}.day b{display:block;font-size:12px;color:var(--mute)}
.day.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.day.on b{color:inherit;opacity:.7}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel)}tr.sub>td{background:var(--panel);padding:6px 12px 14px}
.nowrap{white-space:nowrap}
.wknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.wknav b{font:700 16px Montserrat;padding:0 6px}
.tsrow{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr)) minmax(0,1.3fr) minmax(0,.9fr) 44px;gap:10px;align-items:end;padding:12px;border-radius:12px;background:var(--panel)}
.brk{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:6px}
.out{min-height:44px;display:flex;align-items:center;font:800 20px Montserrat}
.x{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:20px}
.bar{height:8px;border-radius:99px;background:var(--panel);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.agent{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 140px auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.agent:last-child{border:0}
.login{min-height:100vh;display:grid;place-items:center;padding:64px 16px 32px}
.lcard{width:min(560px,100%);display:grid;gap:20px;text-align:center}
.lcard .logo{width:100%;max-width:560px;margin:0 auto;border-radius:18px;box-shadow:0 18px 50px rgba(5,10,28,.25)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{border:1.5px solid var(--line);border-radius:14px;background:var(--bg);padding:18px 12px;cursor:pointer;display:grid;gap:8px;justify-items:center;font-weight:700;font-family:Montserrat}
.choice button span{font:400 13px Inter;color:var(--mute)}
.choice button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--panel)}
.choice svg{width:34px;height:34px}
form.stackf{display:grid;gap:14px;text-align:left}
.corner{position:fixed;top:12px;right:12px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--acc)}
.fields{display:grid;gap:14px}.chk{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;min-height:44px}
.pastrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto 44px;gap:10px;align-items:end;padding:12px;border-radius:12px;background:var(--panel);font-weight:400}
.pastrow .chk{min-height:44px;white-space:nowrap}.pastrow .cl{grid-column:1/-1}ul.past{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:8px}ul.past li{display:grid}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg label{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}.seg label.on{border-color:var(--acc);background:var(--accBg)}.rset{position:relative;display:inline-block;vertical-align:middle;margin-left:4px}.gear{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--mute);cursor:pointer;display:inline-grid;place-items:center}.gear:hover,.gear[aria-expanded=true]{color:var(--ink);border-color:var(--acc)}
.rmenu{margin:8px 0 2px auto;width:max-content;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 12px 30px rgba(5,10,28,.18);display:grid;gap:6px;min-width:190px;text-align:left}.rmenu label{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border:1.5px solid var(--line);border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}.rmenu label.on{border-color:var(--acc);background:var(--accBg)}.rmenu input{width:18px;min-height:18px;margin:0;accent-color:var(--acc)}
.subtabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px}.subtabs button{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;cursor:pointer;color:var(--mute)}.subtabs button[aria-selected=true]{border-color:var(--acc);background:var(--accBg);color:var(--ink)}.subtabs .cnt{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--panel)}
.msel{position:relative}.msel-btn{width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;cursor:pointer;font-weight:400;font-size:16px}.msel-btn[aria-expanded=true]{border-color:var(--acc)}
.msel-list{margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px;background:var(--bg)}.msel-list label{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 10px;border-radius:8px;font-weight:500;cursor:pointer}.msel-list label:hover{background:var(--panel)}
.seg.sm{flex-wrap:nowrap}.seg.sm label{min-height:36px;padding:0 10px;font-size:13px;white-space:nowrap}.seg input{width:18px;min-height:18px;margin:0;accent-color:var(--acc)}
.ext{display:inline-flex;align-items:center;gap:12px;min-height:44px;padding:4px 22px 4px 4px;border-radius:99px;background:#7b8b89;color:#fff;text-decoration:none;font:700 14px Montserrat,sans-serif;letter-spacing:.14em}.ext:hover{background:#6a7a78}.ext i{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}.ext img{width:30px;height:30px;display:block}
.avt td{padding:8px 6px}.avt input[type=time]{min-width:110px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--bg);border-radius:18px;width:min(820px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:clamp(16px,3vw,28px);display:grid;gap:16px}
.slip{border:1px solid var(--line);border-radius:14px;padding:clamp(14px,2.5vw,24px);display:grid;gap:16px}
.slip header{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.slip header img{width:40px;height:40px;border-radius:50%}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.meta span{display:block;font-size:12px;color:var(--mute)}
.net{display:flex;justify-content:space-between;align-items:baseline;background:var(--ink);color:var(--bg);border-radius:12px;padding:14px 18px;flex-wrap:wrap;gap:8px}
.notes{position:fixed;top:72px;right:max(5vw,16px);width:min(380px,calc(100vw - 32px));z-index:40;max-height:70vh;overflow:auto;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.note{text-align:left;width:100%;border:0;background:none;padding:10px;border-radius:10px;cursor:pointer;display:grid;gap:2px}
.note:hover{background:var(--panel)}.note.unread{background:var(--accBg)}
.empty{padding:28px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;font-weight:600;max-width:calc(100vw - 32px)}
.dbnote{background:var(--warnBg);color:var(--warn);padding:10px max(5vw,16px);font-size:14px}
.ratein{width:120px}.edt input{min-height:38px;padding:6px 8px}
pre,.scroll{overflow-x:auto}
@media(prefers-reduced-motion:no-preference){.card,.modal{animation:up .25s ease-out}@keyframes up{from{opacity:0;transform:translateY(6px)}}}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}.agent{grid-template-columns:minmax(0,1fr) auto}.agent .wkc{grid-column:1/-1;order:3}
.tsrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tsrow .cl,.tsrow .bf,.pastrow .cl{grid-column:1/-1}.pastrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:600px){.hero{grid-template-columns:auto minmax(0,1fr)}.hero .btn{grid-column:1/-1}.week{grid-template-columns:repeat(4,minmax(0,1fr))}
.top{position:static}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}.stack tr{border-bottom:1px solid var(--line)}}
</style><script src="firebase-config.js"></script><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

<div id="app"><div class="login"><p class="mute">Loading Speak2Connect Portal…</p></div></div>

<script>
{
const UPW='data:image/png;base64,{{UPWORK}}';
const UPRE=/^https:\/\/(www\.)?upwork\.com\/[^\s"'<>]+$/i;
const EMB='data:image/png;base64,{{EMBLEM}}',LOGO='data:image/jpeg;base64,{{LOGO}}';
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>ds(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const wkStart=s=>addD(s,-((pd(s).getDay()+6)%7));
const fmtD=s=>pd(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const fmtDY=s=>pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const fmtWk=s=>`${pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${fmtDY(addD(s,6))}`;
const fmtT=t=>{if(!t)return'—';let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${pad(m||0)} ${ap}`};
const mins=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return isNaN(h)?null:h*60+(m||0)};
const span=(a,b)=>{const x=mins(a),y=mins(b);if(x==null||y==null)return 0;let d=y-x;if(d<=0)d+=1440;return d};
const r2=n=>Math.round((+n||0)*100)/100;
const hrs=n=>`${r2(n).toLocaleString('en-US',{maximumFractionDigits:2})} h`;
const usd=n=>(+n||0).toLocaleString('en-US',{style:'currency',currency:'USD'});
const php=n=>(+n||0).toLocaleString('en-PH',{style:'currency',currency:'PHP'});
const ago=t=>{if(!t)return'';const s=(Date.now()-t)/1e3;if(s<60)return'just now';if(s<3600)return`${Math.floor(s/60)} min ago`;if(s<86400)return`${Math.floor(s/3600)} h ago`;return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'})};
const slug=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9_\-.~:@+]/g,'-').replace(/^\.+/,'x').slice(0,120);
const ckey=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'client';
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const tsHours=e=>r2(Math.max(0,span(e.timeIn,e.timeOut)-(+e.breakMin||0))/60);
const list=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const joinA=xs=>xs.length<2?xs.join(''):xs.slice(0,-1).join(', ')+' and '+xs[xs.length-1];
const VOC=/^https:\/\/(www\.)?(vocaroo\.com|voca\.ro)\/[A-Za-z0-9/_-]+$/;
const TZ_TOP=['Asia/Manila','Asia/Singapore','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','Europe/London','Australia/Sydney'];
let TZ_ALL=TZ_TOP;try{TZ_ALL=Intl.supportedValuesOf('timeZone')}catch(e){}
const myTZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Manila'}catch(e){return'Asia/Manila'}})();
const ROLES={'Virtual assistant':'virtual assistant','Customer support':'customer support specialist','Appointment setter':'appointment setter','Sales / cold calling':'sales and cold-calling specialist','Executive assistant':'executive assistant','Bookkeeping':'bookkeeper','Social media management':'social media manager','Technical support':'technical support specialist','Other':''};
const SHIFTS=['Day shift (PH time)','Night shift (US hours)','Mid shift','Flexible'];

async function login(form){const fd=Object.fromEntries(new FormData(form));const role=form.dataset.role;const email=String(fd.email||'').trim().toLowerCase();
 if(role==='admin'){const err=$('#loginErr');let h='';try{h=await sha256(String(fd.user||'').trim().toLowerCase()+':'+String(fd.pass||''))}catch(e){err.textContent='This browser cannot check the password. Open the portal over https.';return}
  const role=ADMINS[h];if(!role){err.textContent='Incorrect username or password.';form.pass.value='';form.pass.focus();return}
  sess.admin={name:String(fd.user).trim(),v:2,role};ui.atab='agents';sess.mode='admin';ui.adminLogin=false;saveSess();if(location.hash==='#admin')history.replaceState(null,'',location.pathname+location.search);render();return}
 const err=$('#loginErr');const fail=m=>{err.textContent=m;return};const pass=String(fd.pass||'');const create=form.dataset.mode==='create';
 if(!/^\S+@\S+\.\S+$/.test(email))return fail('Enter a valid email address.');
 if(pass.length<6)return fail('Passwords are at least 6 characters.');
 if(!db)return fail('Saving is not available here, so you cannot sign in yet.');
 const id='f_'+slug(email);let ex=S.people[id];if(!ex){try{const d=await col('people').doc(id).get();if(d.exists)ex=d.data()}catch(e){}}
 if(create){if(ex)return fail('An account with this email already exists. Sign in instead, or ask your admin for your password.');
  const name=String(fd.name||'').trim();if(!name)return fail('Enter your full name.');if(pass!==String(fd.pass2||''))return fail('The two passwords do not match.');
  const doc={role:'freelancer',name,email,password:pass,createdAt:Date.now(),status:'active',onboarded:false};
  if(!await W(()=>col('people').doc(id).set(doc)))return;ex=doc}
 else{if(!ex||ex.role!=='freelancer')return fail('No freelancer account uses this email. Check the spelling or create an account.');
  if(!ex.password){if(!await W(()=>col('people').doc(id).update({password:pass,passwordSetAt:Date.now()}),'Password set. Use it next time you sign in.'))return}
  else if(ex.password!==pass){form.pass.value='';form.pass.focus();return fail('Incorrect email or password. Forgot it? Ask your admin.')}}
 ui.loginMode='signin';sess.fid=id;sess.mode='freelancer';ui.ob=LS.get('snl.ob.'+id,null)||{name:ex.name};ui.step=0;ui.editing=false
 saveSess();render()}

async function migrate(){if(migrating||!db)return;migrating=true;try{
  const ts=await col('timesheets').get();const cl={};
  for(const d of ts.docs){const x=d.data();if(x.client)cl[ckey(x.client)]=x.client;if(x.date&&(!x.wk||!x.pw)){const w=wkStart(x.date);await col('timesheets').doc(d.id).update({wk:w,pw:x.pid+'|'+w})}}
  for(const[k,name]of Object.entries(cl))await col('clients').doc(k).set({name});
  const ps=await col('people').get();
  for(const d of ps.docs){const x=d.data();if(typeof x.photo==='string'&&PHOTO.test(x.photo)){await col('photos').doc(d.id).set({photo:x.photo});await col('people').doc(d.id).update({photo:'',thumb:await thumbOf(x.photo)})}}
  await db.doc('settings/app').set({...S.settings,v2:true})}catch(e){console.error('migrate',e);migrating=false}}
let purging=false;
async function purgeTest(){if(purging||!db)return;purging=true;try{
  const ids=new Set(TEST_IDS.filter(id=>S.people[id]));(await col('people').where('test','==',true).get()).docs.forEach(d=>ids.add(d.id));
  for(const id of TEST_IDS){if(!ids.has(id)){const g=await col('people').doc(id).get();if(g.exists)ids.add(id)}}
  for(const id of ids){for(const c of['timesheets','payslips','rates','notes']){const q=await col(c).where('pid','==',id).get();for(const d of q.docs)await col(c).doc(d.id).delete()}
   await col('photos').doc(id).delete();await col('people').doc(id).delete()}
  await db.doc('settings/app').set({...S.settings,noTest:true})}catch(e){console.error('purge',e);purging=false}}
(async()=>{loaded=false;
 const cfg=window.SNL_FIREBASE_CONFIG;const useFb=!!(cfg&&cfg.apiKey&&cfg.projectId);
 try{db=useFb?await firebaseDB(cfg):(window.claude&&window.claude.use?await window.claude.use('db'):null)}catch(e){db=null;console.error(e)}
 loaded=true;
 if(!db){dbNote(useFb?'Could not connect to Firebase. Check the settings in firebase-config.js, and that Firestore and Anonymous sign-in are turned on in your Firebase project.':window.claude?'Saving is not available in this view. Open the portal on claude.ai while signed in to store data.':'Saving is not set up on this copy. Add your Firebase project settings to firebase-config.js (see the README).');render();return}
 render()})();
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak n' Link Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm, exact operations desk for an agency, nothing decorative.
   IDEA: the headset switchboard: one black console band, clean white call sheets beneath.
   PICTURE: the working portal itself; the logo leads the sign-in screen.
   COLOUR and TYPE: the logo's black and white, one signal orange; Montserrat (the wordmark's lettering) + Inter.
   LAYOUT: black console header with tabs, cards and tables in a 1240px column, stacking under 600px. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#111214);--ink:light-dark(#0b0b0c,#f1f1ee);--mute:light-dark(#5b5e64,#a3a6ac);
--line:light-dark(#e3e3df,#2b2d31);--panel:light-dark(#f5f5f2,#1a1b1e);--acc:#ff4f1a;--accInk:light-dark(#b9340a,#ff8a5c);
--accBg:light-dark(#fff0ea,#3a1d12);--ok:light-dark(#17703f,#6fd79c);--okBg:light-dark(#e7f6ed,#13301f);
--warn:light-dark(#8a5a00,#f2c26b);--warnBg:light-dark(#fff6df,#352a12);--logoF:none;--btnInk:light-dark(#fff,#0b0b0c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark;--logoF:invert(1)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--logoF:invert(1)}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Montserrat,Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,4vw,44px);font-weight:800}h2{font-size:24px;font-weight:700}h3{font-size:17px;font-weight:700}
p{margin:.3em 0}.mute{color:var(--mute)}.small{font-size:13px}
a{color:var(--accInk)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:96px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
input[type=checkbox]{width:20px;min-height:20px;height:20px;accent-color:var(--acc);margin:0}
label.f{display:grid;gap:6px;font-weight:600;font-size:14px}label.f small{font-weight:400;color:var(--mute)}
.req::after{content:" *";color:var(--accInk)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--btnInk);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--ink)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.link{border:0;background:none;color:var(--accInk);padding:0 6px;min-height:36px}.btn.danger{color:#c42b1c}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.top{background:#0b0b0c;color:#f4f4f1;padding:12px max(5vw,16px);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px;filter:invert(1)}
.brand b{font:800 18px Montserrat,sans-serif;display:block;line-height:1}.brand span{font:600 11px Montserrat,sans-serif;letter-spacing:.3em;color:#b9b9b4}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.who .btn{border-color:#3a3b3f;background:transparent;color:#f4f4f1}.who .btn:hover{border-color:#f4f4f1}
.who .btn.acc{background:var(--acc);border-color:var(--acc)}
.pill{font-size:13px;padding:6px 12px;border-radius:99px;background:#232427;color:#d8d8d3;white-space:nowrap}
.bell{position:relative}.bell i{position:absolute;top:-6px;right:-6px;background:var(--acc);color:#fff;font:700 11px Inter;border-radius:99px;padding:2px 6px;font-style:normal}
.tabs{display:flex;gap:4px;padding:0 max(5vw,16px);border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bg)}
.tabs button{border:0;background:none;padding:14px 14px 12px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;min-height:48px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
main>div{display:grid;gap:20px}main>div:empty{display:none}main{max-width:1240px;margin:0 auto;padding:28px max(4vw,16px) 64px;display:grid;gap:20px}
.card{border:1px solid var(--line);border-radius:16px;padding:clamp(16px,2.4vw,24px);background:var(--bg);display:grid;gap:14px;align-content:start}
.card.soft{background:var(--panel);border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
.hero{grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 22px Montserrat}
.lede{font-size:17px}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;margin:0 6px 6px 0}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0}.dl dt{color:var(--mute);font-size:14px}.dl dd{margin:0;font-weight:500}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--panel);white-space:nowrap}
.badge.ok{background:var(--okBg);color:var(--ok)}.badge.warn{background:var(--warnBg);color:var(--warn)}.badge.acc{background:var(--accBg);color:var(--accInk)}
.big{font:800 clamp(28px,4vw,40px) Montserrat;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border-radius:12px;padding:14px 16px}.stat span{display:block;font-size:13px;color:var(--mute)}.stat b{font:800 24px Montserrat}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;text-align:center}.day b{display:block;font-size:12px;color:var(--mute)}
.day.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.day.on b{color:inherit;opacity:.7}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel)}tr.sub>td{background:var(--panel);padding:6px 12px 14px}
.nowrap{white-space:nowrap}
.wknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.wknav b{font:700 16px Montserrat;padding:0 6px}
.tsrow{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr)) minmax(0,1.3fr) minmax(0,.9fr) 44px;gap:10px;align-items:end;padding:12px;border-radius:12px;background:var(--panel)}
.brk{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:6px}
.out{min-height:44px;display:flex;align-items:center;font:800 20px Montserrat}
.x{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:20px}
.bar{height:8px;border-radius:99px;background:var(--panel);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.agent{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 140px auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.agent:last-child{border:0}
.login{min-height:100vh;display:grid;place-items:center;padding:64px 16px 32px}
.lcard{width:min(560px,100%);display:grid;gap:20px;text-align:center}
.lcard .logo{width:min(320px,80%);margin:0 auto;filter:var(--logoF)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{border:1.5px solid var(--line);border-radius:14px;background:var(--bg);padding:18px 12px;cursor:pointer;display:grid;gap:8px;justify-items:center;font-weight:700;font-family:Montserrat}
.choice button span{font:400 13px Inter;color:var(--mute)}
.choice button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--panel)}
.choice svg{width:34px;height:34px}
form.stackf{display:grid;gap:14px;text-align:left}
.corner{position:fixed;top:12px;right:12px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--acc)}
.fields{display:grid;gap:14px}.chk{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;min-height:44px}
.avt td{padding:8px 6px}.avt input[type=time]{min-width:110px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--bg);border-radius:18px;width:min(820px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:clamp(16px,3vw,28px);display:grid;gap:16px}
.slip{border:1px solid var(--line);border-radius:14px;padding:clamp(14px,2.5vw,24px);display:grid;gap:16px}
.slip header{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.slip header img{width:40px;height:40px;filter:var(--logoF)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.meta span{display:block;font-size:12px;color:var(--mute)}
.net{display:flex;justify-content:space-between;align-items:baseline;background:var(--ink);color:var(--bg);border-radius:12px;padding:14px 18px;flex-wrap:wrap;gap:8px}
.notes{position:fixed;top:72px;right:max(5vw,16px);width:min(380px,calc(100vw - 32px));z-index:40;max-height:70vh;overflow:auto;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.note{text-align:left;width:100%;border:0;background:none;padding:10px;border-radius:10px;cursor:pointer;display:grid;gap:2px}
.note:hover{background:var(--panel)}.note.unread{background:var(--accBg)}
.empty{padding:28px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;font-weight:600;max-width:calc(100vw - 32px)}
.dbnote{background:var(--warnBg);color:var(--warn);padding:10px max(5vw,16px);font-size:14px}
.ratein{width:120px}.edt input{min-height:38px;padding:6px 8px}
pre,.scroll{overflow-x:auto}
@media(prefers-reduced-motion:no-preference){.card,.modal{animation:up .25s ease-out}@keyframes up{from{opacity:0;transform:translateY(6px)}}}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}.agent{grid-template-columns:minmax(0,1fr) auto}.agent .wkc{grid-column:1/-1;order:3}
.tsrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tsrow .cl,.tsrow .bf{grid-column:1/-1}}
@media(max-width:600px){.hero{grid-template-columns:auto minmax(0,1fr)}.hero .btn{grid-column:1/-1}.week{grid-template-columns:repeat(4,minmax(0,1fr))}
.top{position:static}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}.stack tr{border-bottom:1px solid var(--line)}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

<body>
<div id="dbnote"></div>
<div id="app"><div class="login"><p class="mute">Loading Speak n' Link Portal…</p></div></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
{
const EMB='data:image/png;base64,{{EMBLEM}}',LOGO='data:image/png;base64,{{LOGO}}';
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>ds(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const wkStart=s=>addD(s,-((pd(s).getDay()+6)%7));
const fmtD=s=>pd(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const fmtDY=s=>pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const fmtWk=s=>`${pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${fmtDY(addD(s,6))}`;
const fmtT=t=>{if(!t)return'—';let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${pad(m||0)} ${ap}`};
const mins=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return isNaN(h)?null:h*60+(m||0)};
const span=(a,b)=>{const x=mins(a),y=mins(b);if(x==null||y==null)return 0;let d=y-x;if(d<=0)d+=1440;return d};
const r2=n=>Math.round((+n||0)*100)/100;
const hrs=n=>`${r2(n).toLocaleString('en-US',{maximumFractionDigits:2})} h`;
const usd=n=>(+n||0).toLocaleString('en-US',{style:'currency',currency:'USD'});
const php=n=>(+n||0).toLocaleString('en-PH',{style:'currency',currency:'PHP'});
const ago=t=>{if(!t)return'';const s=(Date.now()-t)/1e3;if(s<60)return'just now';if(s<3600)return`${Math.floor(s/60)} min ago`;if(s<86400)return`${Math.floor(s/3600)} h ago`;return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'})};
const slug=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9_\-.~:@+]/g,'-').replace(/^\.+/,'x').slice(0,120);
const ckey=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'client';
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const tsHours=e=>r2(Math.max(0,span(e.timeIn,e.timeOut)-(+e.breakMin||0))/60);
const list=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const joinA=xs=>xs.length<2?xs.join(''):xs.slice(0,-1).join(', ')+' and '+xs[xs.length-1];
const VOC=/^https:\/\/(www\.)?(vocaroo\.com|voca\.ro)\/[A-Za-z0-9/_-]+$/;
const TZ_TOP=['Asia/Manila','Asia/Singapore','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','Europe/London','Australia/Sydney'];
let TZ_ALL=TZ_TOP;try{TZ_ALL=Intl.supportedValuesOf('timeZone')}catch(e){}
const myTZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Manila'}catch(e){return'Asia/Manila'}})();
const ROLES={'Virtual assistant':'virtual assistant','Customer support':'customer support specialist','Appointment setter':'appointment setter','Sales / cold calling':'sales and cold-calling specialist','Executive assistant':'executive assistant','Bookkeeping':'bookkeeper','Social media management':'social media manager','Technical support':'technical support specialist','Other':''};
const SHIFTS=['Day shift (PH time)','Night shift (US hours)','Mid shift','Flexible'];
const STEPS=[
 {t:'About you',d:'The basics clients see first.',f:[{k:'name',l:'Full name',req:1},{k:'location',l:'City and country',req:1,ph:'Cebu City, Philippines'},{k:'phone',l:'Phone or WhatsApp',ph:'Optional'}]},
 {t:'Your work',d:'What you do and where you have done it.',f:[{k:'role',l:'Primary role',type:'select',opts:Object.keys(ROLES),req:1},{k:'roleOther',l:'If Other, describe your role',ph:'e.g. Medical receptionist'},{k:'years',l:'Years of experience',type:'number',req:1},{k:'industries',l:'Industries you have worked in',ph:'Real estate, healthcare, e-commerce'}]},
 {t:'Skills and tools',d:'Separate each item with a comma.',f:[{k:'skills',l:'Key skills',req:1,ph:'Inbound calls, calendar management, CRM updates'},{k:'tools',l:'Tools and software',ph:'HubSpot, GoHighLevel, Zendesk, Google Workspace'},{k:'languages',l:'Languages',req:1,ph:'English, Filipino'}]},
 {t:'Highlights',d:'Proof of your work.',f:[{k:'achievement',l:'Your proudest work result',type:'textarea',req:1,ph:'Booked 120+ appointments a month for a US roofing company'},{k:'past',l:'Past clients or companies',ph:'Optional'},{k:'education',l:'Education or certifications',ph:'Optional'}]},
 {t:'Setup and voice',d:'Your workstation and a short voice introduction.',f:[{k:'speed',l:'Internet speed (Mbps)',type:'number'},{k:'backup',l:'I have backup internet or power',type:'check'},{k:'shift',l:'Preferred shift',type:'select',opts:SHIFTS},{k:'vocaroo',l:'Vocaroo link to your voice recording',req:1,ph:'https://voca.ro/…',hint:'Record a short introduction at vocaroo.com, then paste the share link here. Keep it to 1 minute or less.'},{k:'vocOk',l:'My recording is 1 minute or shorter',type:'check',req:1}]}
];
let db=null,loaded=false;
const S={people:{},timesheets:{},rates:{},payslips:{},notes:{},settings:{fx:0}};
let sess=LS.get('snl.sess',{});if(sess.admin&&sess.admin.v!==2)delete sess.admin;
const TEST=['test','test2','test3'];
const ADMIN_HASH='488fad9002c9d855c0d195866ae28734351200c5ccc15ad584b20af096e6eee8';
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const saveSess=()=>LS.set('snl.sess',sess);
const wk0=wkStart(today());
const ui={loginRole:sess.lastRole||'',ftab:'profile',atab:'agents',fweek:wk0,aweek:wk0,pweek:wk0,cweek:wk0,sort:'hours',q:'',inactive:false,
 ob:{},step:0,editing:false,av:null,availOpen:false,ts:null,expanded:{},confirm:'',bellOpen:false,modal:null,busy:false};
const toast=m=>{const t=$('#toast');t.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',3200)};
const dbNote=m=>{$('#dbnote').innerHTML=m?`<div class="dbnote">${esc(m)}</div>`:''};
async function W(fn,ok){if(!db){toast('Storage is not available here, so nothing was saved.');return false}
 try{await fn();if(ok)toast(ok);return true}catch(e){toast(e&&e.code==='invalid_argument'?'You do not have permission to save here.':(e&&e.code==='quota_exceeded'?'Storage is full. Remove old records first.':'Could not save. Please try again.'));return false}}
const col=c=>db.collection(c);
const people=r=>Object.entries(S.people).filter(([,p])=>p.role===r).map(([id,p])=>({id,...p}));
const entries=()=>Object.entries(S.timesheets).map(([id,e])=>({id,...e}));
const inWeek=(e,w)=>e.date>=w&&e.date<=addD(w,6);
const availHours=av=>r2(DAYS.reduce((s,d)=>s+(av&&av.days&&av.days[d]&&av.days[d].on?span(av.days[d].start,av.days[d].end)/60:0),0));
function psTot(p){const fx=+p.fx||0;const lines=(p.lines||[]).map(l=>({...l,usd:r2((+l.rate||0)*(+l.hours||0))}));
 const gUsd=r2(lines.reduce((s,l)=>s+l.usd,0)),hours=r2(lines.reduce((s,l)=>s+(+l.hours||0),0)),adj=r2((p.adjustments||[]).reduce((s,a)=>s+(+a.amount||0),0)),gPhp=r2(gUsd*fx);
 return{lines,gUsd,hours,gPhp,adj,net:r2(gPhp+adj),fx}}
const low=s=>String(s).split(' ').map(w=>/[A-Z].*[A-Z]/.test(w)?w:w.toLowerCase()).join(' ');
const article=w=>/^[aeiou]/i.test(w)?'an':'a';
function makeSummary(a){const role=(a.role==='Other'?a.roleOther:ROLES[a.role])||a.roleOther||'remote professional';const y=+a.years||0;const ind=list(a.industries).map(low);
 const out=[`${a.name} is ${article(role)} ${role.toLowerCase()} based in ${a.location} with ${y} year${y===1?'':'s'} of experience${ind.length?` across ${joinA(ind)}`:''}.`,`Core strengths include ${joinA(list(a.skills).map(low))}.`];
 if(list(a.tools).length)out.push(`Works confidently in ${joinA(list(a.tools))}.`);
 if(a.achievement)out.push(`Highlight: ${a.achievement.trim().replace(/\.?$/,'.')}`);
 if(a.past)out.push(`Has supported ${a.past.trim().replace(/\.$/,'')}.`);
 if(a.education)out.push(`Background: ${a.education.trim().replace(/\.?$/,'.')}`);
 out.push(`Speaks ${joinA(list(a.languages))}${a.speed?`, works on a ${a.speed} Mbps connection`:''}${a.backup?' with backup internet or power':''}${a.shift?`, and prefers ${a.shift.charAt(0).toLowerCase()+a.shift.slice(1)}`:''}.`);
 return out.join(' ')}
const makeHead=a=>`${a.role==='Other'?(a.roleOther||'Remote professional'):a.role} · ${+a.years||0} yr${+a.years===1?'':'s'} experience · ${a.location}`;

 <div class="fields">${st.f.map(q=>{const v=a[q.k]??'';const lab=`<span class="${q.req?'req':''}">${q.l}</span>`;

function paint(id,html){const el=document.getElementById(id);if(!el)return;const a=document.activeElement;
 if(a&&el.contains(a)&&a.matches('input,select,textarea')){el.dataset.stale='1';return}el.dataset.stale='';el.innerHTML=html}
document.addEventListener('focusout',()=>setTimeout(()=>{if(document.querySelector('[data-stale="1"]'))renderData()},50));
function renderData(){const v=view();if(v!==lastView){render();return}
 if(v==='admin'){const n=Object.values(S.notes).filter(x=>!x.read).length;const b=$('#bellN');if(b){b.textContent=n;b.hidden=!n}
  if(ui.atab==='agents')paint('agList',agentsHTML());if(ui.atab==='timesheets')paint('atList',adminTsHTML());if(ui.atab==='payslips')paint('apList',adminPayHTML());
  paint('notesPanel',ui.bellOpen?notesHTML():'')}
 if(v==='freelancer'){const p=S.people[sess.fid];if(ui.ftab==='profile')paint('fProfile',fProfileHTML(p));
  if(ui.ftab==='timesheet'){paint('tsList',fTsListHTML());const dl=$('#clientList');if(dl)dl.innerHTML=clientNames().map(c=>`<option value="${esc(c)}">`).join('')}
  if(ui.ftab==='payslips')paint('fPay',fPayHTML())}
 if(v==='client')paint('cList',clientHTML());
 if(ui.modal&&ui.modal.live)paint('modalBody',modalBody())}
function clientNames(){const m=new Map();people('client').forEach(c=>c.company&&m.set(ckey(c.company),c.company));entries().forEach(e=>e.client&&!m.has(ckey(e.client))&&m.set(ckey(e.client),e.client));return[...m.values()].sort((a,b)=>a.localeCompare(b))}
const wkNav=(k,lbl)=>`<div class="wknav"><button class="btn sm ghost" data-act="wk" data-k="${k}" data-d="-7" aria-label="Previous week">‹</button><b>${fmtWk(ui[k])}</b><button class="btn sm ghost" data-act="wk" data-k="${k}" data-d="7" aria-label="Next week">›</button>${ui[k]!==wk0?`<button class="btn sm link" data-act="wk" data-k="${k}" data-d="0">This week</button>`:''}${lbl?`<span class="small mute">${lbl}</span>`:''}</div>`;
const chipsOf=s=>list(s).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
const vocLink=u=>u&&VOC.test(u)?`<a class="btn sm ghost" href="${esc(u)}" target="_blank" rel="noopener">▶ Play voice introduction</a>`:'<span class="mute small">No voice recording yet</span>';
function weekStrip(av){return`<div class="week">${DAYS.map(d=>{const x=av&&av.days&&av.days[d];return`<div class="day${x&&x.on?' on':''}"><b>${d}</b>${x&&x.on?`${fmtT(x.start)}<br>${fmtT(x.end)}`:'Off'}</div>`}).join('')}</div>`}

 return`<section class="card hero"><div class="avatar">${esc(initials(p.name))}</div><div><h2>${esc(p.name)}</h2><p class="mute">${esc(p.headline||'')}</p>${admin?`<p class="small mute">${esc(p.email)}${a.phone?' · '+esc(a.phone):''}</p>`:''}</div>${admin?'':`<button class="btn ghost" data-act="editPortfolio">Edit portfolio</button>`}</section>
 <div class="grid2"><section class="card"><h3>Portfolio summary</h3><p class="lede">${esc(p.summary||'')}</p>
 ${a.skills?`<div><p class="small mute">Skills</p>${chipsOf(a.skills)}</div>`:''}${a.tools?`<div><p class="small mute">Tools</p>${chipsOf(a.tools)}</div>`:''}<div>${vocLink(p.vocaroo)}</div></section>
 <section class="card"><h3>Details</h3><dl class="dl">${[['Location',a.location],['Experience',a.years!=null&&a.years!==''?`${a.years} years`:''],['Industries',a.industries],['Languages',a.languages],['Past clients',a.past],['Education',a.education],['Preferred shift',a.shift],['Internet',a.speed?`${a.speed} Mbps${a.backup?' + backup':''}`:'']].filter(x=>x[1]).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></section></div>`}

 return portfolioHTML(p,false)+`<section class="card"><div class="row sp"><div><h3>Availability to work</h3><p class="mute small">${av?`Sent to admin ${ago(av.submittedAt)} · ${esc(av.tz)}`:'Tell the team when you can take shifts.'}</p></div>

function renderAvail(){const el=$('#availForm');if(!el)return;if(!ui.availOpen){el.innerHTML='';return}const a=ui.av;

 <div class="scroll"><table class="avt"><thead><tr><th>Day</th><th>Available</th><th>From</th><th>To</th><th class="n">Hours</th></tr></thead><tbody>

 <div class="row sp"><p><span class="big" id="avTot">${hrs(availHours(a))}</span> <span class="mute">per week</span></p><div class="row"><button class="btn ghost" data-act="closeAvail">Cancel</button><button class="btn acc" data-act="submitAvail">Submit availability</button></div></div></section>`}
const newRow=c=>({client:c||'',timeIn:'09:00',timeOut:'17:00',brk:'60',unit:'min'});
const rowMin=r=>Math.round((+r.brk||0)*(r.unit==='hr'?60:1));
const rowHours=r=>r2(Math.max(0,span(r.timeIn,r.timeOut)-rowMin(r))/60);

 ${t.rows.map((r,i)=>`<div class="tsrow"><label class="f cl"><span class="req">Client name</span><input list="clientList" data-ts="${i}.client" value="${esc(r.client)}" placeholder="Client or company"></label>

 <div class="row sp">${t.editId?'<span></span>':`<button class="btn ghost" data-act="tsAdd">+ Add client hours</button>`}

function entryRows(es,mine){return es.sort((a,b)=>(a.date+a.timeIn).localeCompare(b.date+b.timeIn)).map(e=>{const c=ui.confirm==='ts:'+e.id;

 if(role==='client'){sess.cid=id;sess.mode='client'}else{sess.fid=id;sess.mode='freelancer';ui.ob=LS.get('snl.ob.'+id,null)||{name:String(fd.name).trim()};ui.step=0;ui.editing=false}
 saveSess();render()}

 obBack:()=>{ui.step=Math.max(0,ui.step-1);renderOnboard()},
 obCancel:()=>{ui.editing=false;render()},
 obRegen:()=>{ui.ob.summary=makeSummary(ui.ob);ui.ob.headline=makeHead(ui.ob);renderOnboard()},
 obSave:async()=>{const a=ui.ob;const profile={};STEPS.forEach(s=>s.f.forEach(q=>{if(!['vocaroo','vocOk'].includes(q.k))profile[q.k]=a[q.k]??''}));
  const ok=await W(()=>col('people').doc(sess.fid).update({name:String(a.name).trim(),profile,summary:a.summary,headline:a.headline,vocaroo:a.vocaroo,onboarded:true,profileUpdatedAt:Date.now()}),'Portfolio saved');
  if(ok){LS.set('snl.ob.'+sess.fid,null);ui.editing=false;ui.ftab='profile';render()}},
 editPortfolio:()=>{const p=S.people[sess.fid];ui.ob={...clone(p.profile),name:p.name,vocaroo:p.vocaroo,vocOk:true,summary:p.summary,headline:p.headline};ui.step=0;ui.editing=true;render()},
 openAvail:()=>{const av=S.people[sess.fid].availability;ui.av=av?clone(av):{tz:myTZ,notes:'',days:Object.fromEntries(DAYS.map((d,i)=>[d,{on:i<5,start:'09:00',end:'18:00'}]))};if(!ui.av.tz)ui.av.tz=myTZ;ui.availOpen=true;renderData();renderAvail();$('#availForm').scrollIntoView({behavior:'smooth'})},
 closeAvail:()=>{ui.availOpen=false;renderAvail();renderData()},
 copyMon:()=>{const m=ui.av.days.Mon;['Tue','Wed','Thu','Fri'].forEach(d=>ui.av.days[d]={...m});renderAvail()},
 submitAvail:async()=>{const a=ui.av;const h=availHours(a);if(!h){toast('Tick at least one day with working hours.');return}
  const me=S.people[sess.fid];const av={tz:a.tz,days:a.days,notes:String(a.notes||'').trim(),hours:h,submittedAt:Date.now()};
  const ok=await W(()=>col('people').doc(sess.fid).update({availability:av}));if(!ok)return;
  await W(()=>col('notes').add({kind:'availability',pid:sess.fid,text:`${me.name} submitted availability: ${hrs(h)} a week (${a.tz})`,at:Date.now(),read:false}),'Availability submitted. The admin has been notified.');
  ui.availOpen=false;renderAvail();renderData()},
 tsAdd:()=>{ui.ts.rows.push(newRow());renderTsForm()},
 tsRm:d=>{ui.ts.rows.splice(+d.i,1);renderTsForm()},
 tsCancel:()=>{ui.ts=null;renderTsForm()},
 tsSubmit:async()=>{if(ui.busy)return;const t=ui.ts;const me=S.people[sess.fid];if(!t.date){toast('Choose a date.');return}
  for(const r of t.rows){if(!r.client.trim()){toast('Enter a client name for every row.');return}if(!r.timeIn||!r.timeOut){toast('Enter time in and time out.');return}if(rowHours(r)<=0){toast(`Breaks are longer than the shift for ${r.client}.`);return}}
  ui.busy=true;let ok=true;const now=Date.now();
  for(const r of t.rows){const doc={pid:sess.fid,pname:me.name,client:r.client.trim(),date:t.date,timeIn:r.timeIn,timeOut:r.timeOut,breakMin:rowMin(r),hours:rowHours(r),updatedAt:now};
   if(t.editId){const old=S.timesheets[t.editId]||{};ok=await W(()=>col('timesheets').doc(t.editId).set({...old,...doc}))}else{doc.createdAt=now;ok=await W(()=>col('timesheets').add(doc))}if(!ok)break}
  ui.busy=false;if(ok){toast(t.editId?'Entry updated':`Timesheet submitted (${t.rows.length} ${t.rows.length>1?'entries':'entry'})`);ui.fweek=wkStart(t.date);ui.ts=null;renderTsForm();renderData()}},
 tsEdit:d=>{const e=S.timesheets[d.id];const unit=e.breakMin&&e.breakMin%60===0?'hr':'min';ui.ts={date:e.date,editId:d.id,rows:[{client:e.client,timeIn:e.timeIn,timeOut:e.timeOut,brk:String(unit==='hr'?e.breakMin/60:(+e.breakMin||0)),unit}]};renderTsForm();$('#tsForm').scrollIntoView({behavior:'smooth'})},
 confirm:d=>{ui.confirm=d.k;renderData()},unconfirm:()=>{ui.confirm='';renderData()},
 tsDel:async d=>{ui.confirm='';if(await W(()=>col('timesheets').doc(d.id).delete(),'Entry removed')&&ui.ts&&ui.ts.editId===d.id){ui.ts=null;renderTsForm()}renderData()},
 wk:d=>{ui[d.k]=+d.d===0?wk0:addD(ui[d.k],+d.d);ui.confirm='';renderData()},
 expand:d=>{ui.expanded[d.id]=!ui.expanded[d.id];renderData()},
 openEntry:d=>{ui.confirm='';openModal({type:'entry',id:d.id,title:'Timesheet submission'})},
 aeSave:async d=>{const e=S.timesheets[d.id];const x={...e,client:$('#eClient').value.trim(),date:$('#eDate').value,timeIn:$('#eIn').value,timeOut:$('#eOut').value,breakMin:+$('#eBrk').value||0,updatedAt:Date.now()};x.hours=tsHours(x);
  if(!x.client||!x.date||x.hours<=0){toast('Check the client, date and times.');return}if(await W(()=>col('timesheets').doc(d.id).set(x),'Entry saved'))closeModal()},
 aeDel:async d=>{ui.confirm='';if(await W(()=>col('timesheets').doc(d.id).delete(),'Entry deleted'))closeModal()},
 openAgent:d=>openModal({type:'agent',id:d.id,title:'Freelancer profile',live:1}),
 toggleActive:async d=>{const p=S.people[d.id];await W(()=>col('people').doc(d.id).update({status:p.status==='inactive'?'active':'inactive'}),'Status updated');paint('modalBody',modalBody())},
 bell:()=>{ui.bellOpen=!ui.bellOpen;renderData()},
 note:async d=>{const n=S.notes[d.id];ui.bellOpen=false;if(!n.read)await W(()=>col('notes').doc(d.id).update({read:true}));if(view()==='admin'&&ui.atab!=='agents'){ui.atab='agents';render()}else renderData();if(n.pid&&S.people[n.pid])ACT.openAgent({id:n.pid})},
 readAll:async()=>{for(const[id,n]of Object.entries(S.notes))if(!n.read)await W(()=>col('notes').doc(id).update({read:true}));renderData()},
 saveFx:async()=>{const fx=Math.round(+$('#fxIn').value*10000)/10000;if(!(fx>0)){toast('Enter a valid exchange rate.');return}await W(()=>db.doc('settings/app').set({...S.settings,fx,fxUpdated:Date.now()}),`Exchange rate saved: $1 = ${php(fx)}`)},
 generate:async()=>{if(ui.busy)return;const w=ui.pweek,end=addD(w,6);const fx=+S.settings.fx||0;const by={};
  entries().filter(e=>inWeek(e,w)).forEach(e=>{const m=by[e.pid]=by[e.pid]||{};const k=ckey(e.client);(m[k]=m[k]||{client:e.client,hours:0}).hours+=+e.hours||0});
  const pids=Object.keys(by);if(!pids.length){toast('No timesheets in this cutoff yet.');return}ui.busy=true;renderData();let made=0,kept=0;
  for(const pid of pids){const id=`${pid}__${w}`;const ex=S.payslips[id];if(ex&&ex.status==='released'){kept++;continue}
   const lines=Object.entries(by[pid]).map(([k,l])=>({client:l.client,hours:r2(l.hours),rate:+(S.rates[`${pid}__${k}`]?.rate)||0}));
   const ok=await W(()=>col('payslips').doc(id).set({pid,pname:S.people[pid]?.name||'',weekStart:w,weekEnd:end,fx,lines,adjustments:ex?clone({a:ex.adjustments||[]}).a:[],notes:ex?.notes||'',status:'draft',generatedAt:Date.now()}));if(ok)made++;else break}
  ui.busy=false;toast(`${made} payslip${made===1?'':'s'} generated${kept?`, ${kept} released kept as is`:''}`);renderData()},
 viewSlip:d=>openModal({type:'slip',id:d.id,title:'Payslip',live:1}),
 editSlip:d=>{const p=S.payslips[d.id];ui.edit={fx:p.fx,lines:clone({a:p.lines||[]}).a,adjustments:clone({a:p.adjustments||[]}).a,notes:p.notes||''};openModal({type:'edit',id:d.id,title:`Edit payslip · ${p.pname}`})},
 peAdd:d=>{ui.edit[d.k].push(d.k==='lines'?{client:'',rate:0,hours:0}:{label:'',amount:0});paint('modalBody',modalBody())},
 peRm:d=>{ui.edit[d.k].splice(+d.i,1);paint('modalBody',modalBody())},
 peFxNow:()=>{ui.edit.fx=+S.settings.fx||0;paint('modalBody',modalBody())},
 peSave:async d=>{const e=ui.edit;const p=S.payslips[d.id];const x={...p,fx:+e.fx||0,lines:e.lines.filter(l=>String(l.client).trim()).map(l=>({client:String(l.client).trim(),rate:+l.rate||0,hours:r2(l.hours)})),adjustments:e.adjustments.filter(a=>String(a.label).trim()||+a.amount).map(a=>({label:String(a.label).trim()||'Adjustment',amount:r2(a.amount)})),notes:String(e.notes||'').trim(),editedAt:Date.now()};
  if(await W(()=>col('payslips').doc(d.id).set(x),'Payslip saved'))ACT.viewSlip(d)},
 release:async d=>{const p=S.payslips[d.id];const r=p.status!=='released';await W(()=>col('payslips').doc(d.id).update({status:r?'released':'draft',releasedAt:r?Date.now():null}),r?'Released to freelancer':'Moved back to draft');renderData()},
 psDel:async d=>{ui.confirm='';await W(()=>col('payslips').doc(d.id).delete(),'Payslip deleted');renderData()},
 copySlip:async d=>{try{await navigator.clipboard.writeText(slipText(S.payslips[d.id]));toast('Payslip copied')}catch(e){toast('Copy was blocked by the browser.')}},
 closeModal:()=>closeModal(),closeOverlay:(d,e)=>{if(e.target.classList.contains('overlay'))closeModal()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){if(b.tagName==='A')return;f(b.dataset,e)}});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();login(e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.modal)closeModal();else if(ui.bellOpen){ui.bellOpen=false;renderData()}}});
const val=t=>t.type==='checkbox'?t.checked:t.value;
function onField(e){const t=e.target,ds=t.dataset;
 if(ds.ob){ui.ob[ds.ob]=val(t);if(sess.fid&&!ui.editing)LS.set('snl.ob.'+sess.fid,ui.ob);return}
 if(ds.av){setPath(ui.av,ds.av,val(t));if(ds.av.endsWith('.on')){renderAvail();return}const d=ds.av.split('.')[0];const x=ui.av.days[d];const c=$('#avh-'+d);if(c&&x)c.textContent=x.on?hrs(span(x.start,x.end)/60):'—';const tt=$('#avTot');if(tt)tt.textContent=hrs(availHours(ui.av));return}
 if(ds.ts){if(ds.ts==='date')ui.ts.date=t.value;else{const[i,k]=ds.ts.split('.');ui.ts.rows[+i][k]=t.value;const o=$('#tsTot-'+i);if(o)o.textContent=hrs(rowHours(ui.ts.rows[+i]))}const g=$('#tsGrand');if(g)g.textContent=hrs(ui.ts.rows.reduce((s,r)=>s+rowHours(r),0));return}
 if(ds.pe){setPath(ui.edit,ds.pe,t.value);const tt=psTot(ui.edit);tt.lines.forEach((l,i)=>{const c=$('#peL'+i);if(c)c.textContent=usd(l.usd)});const n=$('#peNet .big');if(n)n.textContent=php(tt.net);return}
 if(t.id==='agQ'){ui.q=t.value;paintAgents()}}
function paintAgents(){const el=$('#agList');if(el)el.innerHTML=agentsHTML()}
document.addEventListener('input',onField);
document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.ob||t.dataset.av||t.dataset.ts||t.dataset.pe){onField(e);return}
 if(t.id==='agSort'){ui.sort=t.value;paintAgents()}if(t.id==='agInact'){ui.inactive=t.checked;paintAgents()}
 if(t.dataset.rate){const v=t.value===''?null:r2(t.value);const k=t.dataset.rate;if(v==null){await W(()=>col('rates').doc(k).delete(),'Rate cleared')}else if(v>=0){await W(()=>col('rates').doc(k).set({pid:t.dataset.pid,client:t.dataset.client,rate:v,updatedAt:Date.now()}),`Rate saved: ${usd(v)}/h for ${t.dataset.client}`)}}});
window.addEventListener('hashchange',render);
document.addEventListener('click',e=>{if(ui.bellOpen&&!e.target.closest('.notes,[data-act=bell]')){ui.bellOpen=false;renderData()}});

render();
(async()=>{const timer=setTimeout(()=>{if(!loaded)dbNote('Still connecting to storage… Data may take a moment to appear.')},10000);
 try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
 if(!db){clearTimeout(timer);loaded=true;dbNote('Saving is not available in this view. Open the portal on claude.ai while signed in to store data.');render();return}
 const cols=['people','timesheets','rates','payslips','notes'];let first=new Set();
 const onData=()=>{if(first.size>=cols.length&&!loaded){loaded=true;clearTimeout(timer);dbNote('')}if(view()!==lastView)render();else renderData()};
 const fail=()=>{clearTimeout(timer);loaded=true;dbNote('Lost connection to storage. Reopen the portal to reconnect.');render()};
 cols.forEach(c=>col(c).onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});S[c]=o;first.add(c);onData()},fail));
 db.doc('settings/app').onSnapshot(d=>{S.settings={fx:0,...(d.exists?d.data():{})};onData()},()=>{});
})();
}
</script>
</body>
